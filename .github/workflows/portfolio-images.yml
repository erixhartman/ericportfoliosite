name: Capture portfolio review images
on:
  push:
    branches: [portfolio/scouting-preview]
    paths: [.github/workflows/portfolio-images.yml]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p assets/project-screens
          python3 -m http.server 8123 > /tmp/portfolio-http.log 2>&1 &
          python3 -m venv /tmp/review-env
          /tmp/review-env/bin/pip -q install selenium
          /tmp/review-env/bin/python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          opts = webdriver.ChromeOptions()
          opts.add_argument('--headless')
          opts.add_argument('--no-sandbox')
          with webdriver.Chrome(options=opts) as driver:
              wait = WebDriverWait(driver, 35)
              driver.set_window_size(460, 850)
              driver.get('https://donna-walks.vercel.app/?demo')
              wait.until(lambda d: 'Loading' not in d.find_element(By.TAG_NAME, 'body').text and 'History' in d.find_element(By.TAG_NAME, 'body').text)
              driver.find_element(By.XPATH, "//*[normalize-space(text())='History']").click()
              wait.until(lambda d: 'Loading' not in d.find_element(By.TAG_NAME, 'body').text)
              driver.save_screenshot('assets/project-screens/donna.png')
              for width in [390, 1280]:
                  driver.set_window_size(width, 850)
                  driver.get('http://localhost:8123')
                  for name in ['projects','about','scouting','highlights','work']:
                      driver.find_element(By.CSS_SELECTOR, '.tabs [href="#'+name+'"]').click()
                      wait.until(lambda d: d.find_element(By.ID,name).is_displayed())
                      assert driver.execute_script('return document.documentElement.scrollWidth <= innerWidth')
                      assert len(driver.find_elements(By.CSS_SELECTOR,'[data-tab]:not([hidden])')) == 1
                  print('Passed section navigation and overflow checks', width)
          PY
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add assets/project-screens
          git commit -m 'Capture public project screens and portfolio player card'
          git push origin HEAD:portfolio/scouting-preview
